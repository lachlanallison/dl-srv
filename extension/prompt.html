<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dl-srv — download</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0.85rem; width: 340px; }
      h1 { font-size: 1rem; margin: 0 0 0.35rem; }
      .filename { font-size: 0.85rem; color: #333; word-break: break-all; margin-bottom: 0.75rem; }
      label { display: block; margin: 0.5rem 0 0.25rem; font-size: 0.85rem; }
      select, input[type='text'] { width: 100%; padding: 0.35rem; box-sizing: border-box; }
      button { width: 100%; margin-top: 0.5rem; padding: 0.45rem; cursor: pointer; }
      button.primary { font-weight: 600; }
      button.secondary { background: #f3f4f6; border: 1px solid #d1d5db; }
      button.cancel { background: #fff; border: 1px solid #d1d5db; color: #6b7280; }
      .status { color: #666; font-size: 0.85rem; min-height: 1.2em; margin-top: 0.35rem; }
      .err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>Send to NAS?</h1>
    <div class="filename" id="filename">…</div>
    <label for="category">Category</label>
    <select id="category">
      <option value="tv">tv</option>
      <option value="movies">movies</option>
      <option value="inbox">inbox</option>
      <option value="music">music</option>
      <option value="_custom">Custom…</option>
    </select>
    <input id="categoryCustom" type="text" placeholder="folder name" hidden />
    <button id="sendNas" class="primary">Send to NAS</button>
    <button id="sendBrowser" class="secondary">Download in browser instead</button>
    <button id="cancel" class="cancel">Cancel download</button>
    <p class="status" id="status"></p>
    <script src="shared.js"></script>
    <script src="prompt.js"></script>
  </body>
</html>
