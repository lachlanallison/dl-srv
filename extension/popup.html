<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dl-srv</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0.75rem; width: 300px; }
      label { display: block; margin: 0.5rem 0 0.25rem; font-size: 0.85rem; }
      select, input[type='text'] { width: 100%; padding: 0.35rem; box-sizing: border-box; }
      button { width: 100%; margin-top: 0.5rem; padding: 0.45rem; cursor: pointer; }
      button.primary { font-weight: 600; }
      .muted { color: #666; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <strong>dl-srv</strong>
    <p class="muted" id="status">Checking server…</p>
    <label for="category">Category</label>
    <select id="category">
      <option value="tv">tv</option>
      <option value="movies">movies</option>
      <option value="inbox">inbox</option>
      <option value="music">music</option>
      <option value="_custom">Custom…</option>
    </select>
    <input id="categoryCustom" type="text" placeholder="folder name" hidden />
    <button id="send" class="primary">Send current tab URL</button>
    <button id="open">Open web UI</button>
    <button id="options">Extension settings</button>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
