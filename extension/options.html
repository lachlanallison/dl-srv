<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dl-srv options</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 560px; line-height: 1.45; }
      label { display: block; margin: 0.75rem 0; }
      input[type='text'], input[type='url'] { width: 100%; padding: 0.4rem; box-sizing: border-box; }
      .hint { color: #666; font-size: 0.85rem; margin-top: 0.25rem; }
    </style>
  </head>
  <body>
    <h1>dl-srv</h1>
    <label>
      Server URL
      <input id="serverUrl" type="url" placeholder="http://nas:35778" />
    </label>
    <label>
      API token
      <input id="token" type="text" />
    </label>
    <label>
      Default category
      <input id="category" type="text" placeholder="inbox" />
      <div class="hint">Folder under your download root (e.g. movies, tv)</div>
    </label>
    <label><input id="enabled" type="checkbox" /> Intercept browser downloads</label>
    <label><input id="autoForceYtdlp" type="checkbox" /> Auto force yt-dlp for intercepted downloads</label>
    <label>
      Min file size (bytes, 0 = all)
      <input id="minSize" type="text" value="0" />
    </label>
    <label>
      Ignore extensions (comma-separated)
      <input id="ignoreExt" type="text" placeholder="html, htm, txt, css, js, json" />
    </label>
    <label>
      Ignore domains (comma-separated)
      <input id="ignoreDomains" type="text" placeholder="example.com" />
    </label>
    <button id="save">Save</button>
    <p id="status"></p>
    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
