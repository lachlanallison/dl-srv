<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dl-srv intercept</title>
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body>
    <div class="stage">
      <div class="window">
        <div class="chrome">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="tabs">
            <div class="tab">Downloading…</div>
          </div>
          <div class="urlbar">
            <span>https://cdn.example.com/files/The.Expanse.S04E01.1080p.mkv</span>
            <span class="right">
              <img src="icon128.png" alt="" />
            </span>
          </div>
        </div>
        <div class="page">
          <div class="dim"></div>
          <div class="page-fill">
            <h2>File download started</h2>
            <p>The.Expanse.S04E01.1080p.mkv</p>
          </div>
          <div class="card prompt">
            <h1>Send to NAS?</h1>
            <div class="filename">The.Expanse.S04E01.1080p.mkv</div>
            <label for="category">Category</label>
            <select id="category">
              <option selected>tv</option>
              <option>movies</option>
              <option>inbox</option>
              <option>music</option>
            </select>
            <button class="primary">Send to NAS</button>
            <button class="secondary">Download in browser instead</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
